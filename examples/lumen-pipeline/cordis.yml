# Lumen report-to-dashboard pipeline on the DSH llm stack. The pipeline's own
# code runs unchanged from the target project; only the LLM transport is the
# DSH facade: every stage call becomes one spawn subagent child with a
# structured-output schema, so retry, metering, routing, and the durable
# session log all come from this composition.

# Credential store: resolves DEEPSEEK_API_KEY per request; no key inlined.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Hand-declared OpenAI-completions route. baseURL honors DSH_PIPELINE_BASE_URL
# so the fault-injection proxy can sit in front without touching this file.
# retryPolicy here is executed by dsh-llm-retry below.
- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      deepseek:
        displayName: DeepSeek (pipeline)
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: !!js "process.env.DSH_PIPELINE_BASE_URL ?? 'https://api.deepseek.com/v1'"
        models:
          - id: deepseek-chat
            contextWindow: 65536
            maxTokens: 8192
          - id: deepseek-reasoner
            contextWindow: 65536
            maxTokens: 8192
        retryPolicy:
          mode: normal
          maxRetries: 3
          retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT]
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0.1

# Orchestrator agent: the parent every pipeline stage spawns from. It never
# takes a model turn itself.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek
        model: deepseek-chat
        cwd: !!js process.cwd()
    persona: |
      You are the Lumen pipeline orchestrator. Pipeline stages run as your
      one-shot children; follow the driver's instructions exactly.
    workspaceContext:
      maxBytes: 1024

# Plain-JSONL persistence (compression 'none') so the session log is directly
# readable for the replay/reuse demo.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js "process.env.DSH_LUMEN_SESSIONS ?? './.sessions'"
    compression: none

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Executes the provider retryPolicy on agent/request-error. Agent turns are the
# only retry boundary, which is why every pipeline call is a subagent child.
- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

# Projection registry must precede the subagent capability.
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn
