# Lumen report-to-dashboard pipeline on the DSH llm stack. The pipeline's own
# code runs unchanged from the target project; only the LLM transport is the
# DSH facade: every stage call becomes one spawn subagent child with a
# structured-output schema, so retry, metering, routing, and the durable
# session log all come from this composition.
#
# The whole LLM endpoint is env-driven (defaults = DeepSeek official):
#   DSH_LLM_PROVIDER    route name              (default deepseek)
#   DSH_LLM_API         wire protocol           (default openai-completions; anthropic-messages supported)
#   DSH_LLM_BASE_URL    endpoint                (default https://api.deepseek.com/v1; DSH_PIPELINE_BASE_URL honored for the fault proxy)
#   DSH_LLM_API_KEY_ENV credential env var name (default DEEPSEEK_API_KEY)
#   DSH_LLM_MODELS      catalog CSV id[:ctx[:max]] (default deepseek-chat:65536:8192,deepseek-reasoner:65536:8192)
#   DSH_MODEL_DEFAULT   stage default model     (default deepseek-chat)
#   DSH_MODEL_STRONG    strong-stage model      (default deepseek-reasoner)

# Credential store: resolves the configured key env var per request; no key inlined.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: llm
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js |-
      (() => {
        const models = (process.env.DSH_LLM_MODELS ?? 'deepseek-chat:65536:8192,deepseek-reasoner:65536:8192')
          .split(',').map(s => s.trim()).filter(Boolean).map(spec => {
            const [id, ctx, maxTokens] = spec.split(':').map(p => p.trim())
            return { id, contextWindow: Number(ctx ?? 65536), maxTokens: Number(maxTokens ?? 8192) }
          })
        return {
          [process.env.DSH_LLM_PROVIDER ?? 'deepseek']: {
            displayName: 'Pipeline LLM',
            apiKeyEnv: process.env.DSH_LLM_API_KEY_ENV ?? 'DEEPSEEK_API_KEY',
            api: process.env.DSH_LLM_API ?? 'openai-completions',
            baseURL: process.env.DSH_LLM_BASE_URL ?? process.env.DSH_PIPELINE_BASE_URL ?? 'https://api.deepseek.com/v1',
            models,
            retryPolicy: {
              mode: 'normal',
              maxRetries: 3,
              retryableCodes: ['EMPTY_RESPONSE', 'RATE_LIMIT', 'SERVER', 'TIMEOUT', 'TRANSPORT'],
              backoff: { initialDelayMs: 500, maxDelayMs: 10000, jitterRatio: 0.1 },
            },
          },
        }
      })()

# Orchestrator agent: the parent every pipeline stage spawns from. It never
# takes a model turn itself.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: !!js process.env.DSH_LLM_PROVIDER ?? 'deepseek'
        model: !!js process.env.DSH_MODEL_DEFAULT ?? 'deepseek-chat'
        cwd: !!js process.cwd()
    persona: |
      You are the Lumen pipeline orchestrator. Pipeline stages run as your
      one-shot children; follow the driver's instructions exactly.
    workspaceContext:
      maxBytes: 1024

# Plain-JSONL persistence (compression 'none') so the session log is directly
# readable for the replay/reuse demo.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_LUMEN_SESSIONS ?? './.sessions'
    compression: none

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

# Executes the provider retryPolicy on agent/request-error. Agent turns are the
# only retry boundary, which is why every pipeline call is a subagent child.
- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

# Projection registry must precede the subagent capability.
- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn
